name: TechIT Fix Broken Images

on:
  schedule:
    # Mahine me ek baar (1 tareekh) â€” broken images auto-fix (health check)
    - cron: '0 5 1 * *'
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Broken Image Fixer
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      run: |
        python fix_broken_images.py
