name: TechIT Auto-Refresh Old Posts

on:
  schedule:
    # Har Sunday 11:30 AM IST â€” ek purana post refresh (SEO freshness)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      count:
        description: 'Kitne purane posts refresh karne hain'
        required: false
        default: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Auto-Refresh Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python refresh_old_posts.py ${{ github.event.inputs.count || '1' }}
