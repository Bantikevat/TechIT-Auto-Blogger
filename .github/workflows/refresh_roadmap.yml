name: TechIT Refresh Learning Roadmap

on:
  schedule:
    # Har Sunday 12:30 PM IST â€” roadmap.html regen (naye posts add ho jayenge)
    - cron: '0 7 * * 0'
  workflow_dispatch:

concurrency:
  group: refresh-roadmap
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Roadmap Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_roadmap.py
