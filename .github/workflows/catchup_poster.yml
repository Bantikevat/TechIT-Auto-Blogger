name: TechIT Catchup Poster

# Fallback jo har 30 min pe check karta â€” agar last post 90 min se purani ho aur
# publishing window (10 AM - 9 PM IST) andar ho, tab automatic ek post publish.
# Yeh missed hourly slots ke liye safety net hai.

on:
  # SAFE MODE â€” automatic catchup band. 3 posts/din wale schedule me
  # catchup extra posts bana deta (5 ghante ka gap > 90 min threshold).
  # Jab zaroorat ho, haath se chalao (workflow_dispatch).
  workflow_dispatch:

concurrency:
  group: auto-poster  # SAME group as auto_poster.yml â€” overlap se bacha
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check if catchup needed
      id: check
      run: |
        # Publishing window: 10 AM - 9 PM IST (04:30 - 15:30 UTC)
        HOUR_UTC=$(date -u +%H)
        MIN_UTC=$(date -u +%M)
        TIME_UTC=$((HOUR_UTC * 60 + MIN_UTC))
        if [ $TIME_UTC -lt 270 ] || [ $TIME_UTC -gt 930 ]; then
          echo "Outside publishing window (10 AM - 9 PM IST). Skip."
          echo "skip=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Latest post time se check
        LATEST=$(curl -s "https://itinfohubs.blogspot.com/feeds/posts/default?alt=json&max-results=1" \
                 | python -c "import sys,json,datetime; d=json.load(sys.stdin); print(d['feed']['entry'][0]['published']['\$t'])")
        LATEST_TS=$(date -u -d "$LATEST" +%s)
        NOW_TS=$(date -u +%s)
        DIFF_MIN=$(( (NOW_TS - LATEST_TS) / 60 ))
        echo "Last post $DIFF_MIN min ago"

        if [ $DIFF_MIN -gt 90 ]; then
          echo "Catchup NEEDED (last post > 90 min ago in window)."
          echo "skip=false" >> $GITHUB_OUTPUT
        else
          echo "Recent post exists, skip catchup."
          echo "skip=true" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python
      if: steps.check.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Deps
      if: steps.check.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Credentials
      if: steps.check.outputs.skip != 'true'
      run: echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Catchup Post
      if: steps.check.outputs.skip != 'true'
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE || 'false' }}
        POSTS_PER_RUN: '1'
        SKIP_COOLDOWN: 'true'
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      run: python auto_post_blogger.py

    - name: Commit updates
      if: steps.check.outputs.skip != 'true'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A || true
        git commit -m "Catchup post [skip ci]" || echo "no changes"
        git pull --rebase --autostash || true
        git push || echo "push failed"
