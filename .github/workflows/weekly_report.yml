name: TechIT Weekly SEO Report

on:
  schedule:
    - cron: '0 5 * * 1'   # Har Monday 10:30 AM IST
  workflow_dispatch:        # Manual trigger bhi

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests google-auth

    - name: Run weekly report
      env:
        GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python weekly_report.py "$(date +%F)"

    - name: Commit report file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add reports || true
        git commit -m "Add weekly SEO report [skip ci]" || echo "No changes"
        git push || echo "Push skipped"
