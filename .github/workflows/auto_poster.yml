name: TechIT Auto Blog Poster

on:
  schedule:
    # NATURAL HOURLY SCHEDULE — 10 AM to 9 PM IST (12 slots/day, 1 post per slot).
    # Better than burst publishing: Google spam signal se bacha, indexing per-post attention deta hai,
    # aur social share bhi natural fasla se hote hain.
    # (POSTS_PER_RUN=1 GitHub variable; concurrency prevents overlap.)
    - cron: '30 4 * * *'    # 10:00 AM IST
    - cron: '30 5 * * *'    # 11:00 AM IST
    - cron: '30 6 * * *'    # 12:00 PM IST
    - cron: '30 7 * * *'    # 01:00 PM IST
    - cron: '30 8 * * *'    # 02:00 PM IST
    - cron: '30 9 * * *'    # 03:00 PM IST
    - cron: '30 10 * * *'   # 04:00 PM IST
    - cron: '30 11 * * *'   # 05:00 PM IST
    - cron: '30 12 * * *'   # 06:00 PM IST
    - cron: '30 13 * * *'   # 07:00 PM IST
    - cron: '30 14 * * *'   # 08:00 PM IST
    - cron: '30 15 * * *'   # 09:00 PM IST
  workflow_dispatch: # Manual trigger

# Ek time pe ek hi run. Backup jab fire ho aur primary chal raha ho to backup skip.
concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  auto_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit changes back to the repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Auto-Poster Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 'true' = posts seedhe LIVE; 'false' = Draft (safe). GitHub Secrets/Variables se set karein.
        PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE || 'false' }}
        # Ek run mein kitne posts banane hain (default 1). vars.POSTS_PER_RUN se badlein.
        POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
        # Telegram auto-share + failure alerts (optional — na ho to skip ho jata hai)
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # IndexNow key (optional override) — default code mein hai
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        # Optional: ImgBB free API key se banner instant CDN par host hoti hai (na ho to repo me save)
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        # Optional: Google Indexing API service-account JSON (poori JSON paste karein) — har post Google ko submit
        GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        # Optional: Multi-platform auto-share (jo set hoga sirf wahi share karega)
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        # Optional: Dev.to / Hashnode cross-post for backlinks
        DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
        HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
      run: |
        python auto_post_blogger.py

    - name: Commit and Push Queue Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A || true
        git commit -m "Update topic queue, posted history and banners [skip ci]" || echo "No changes to commit"
        git pull --rebase --autostash || true
        git push || echo "Push failed (maybe no changes)"
