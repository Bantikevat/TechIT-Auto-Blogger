name: TechIT Auto Blog Poster

on:
  schedule:
    # SAFE MODE â€” sirf 3 posts/din. Google suspension se bacha.
    # 9 AM, 2 PM, 5 PM IST â€” insaan jaisa natural samay.
    # (POSTS_PER_RUN=1; concurrency overlap rokta hai.)
    - cron: '30 3 * * *'    # 09:00 AM IST
    - cron: '30 8 * * *'    # 02:00 PM IST
    - cron: '30 11 * * *'   # 05:00 PM IST
  workflow_dispatch: # Manual trigger

# Ek time pe ek hi run. Backup jab fire ho aur primary chal raha ho to backup skip.
concurrency:
  group: auto-poster
  cancel-in-progress: false

jobs:
  auto_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit changes back to the repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Auto-Poster Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 'true' = posts seedhe LIVE; 'false' = Draft (safe). GitHub Secrets/Variables se set karein.
        PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE || 'false' }}
        # Ek run mein kitne posts banane hain (default 1). vars.POSTS_PER_RUN se badlein.
        POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
        # Telegram auto-share + failure alerts (optional â€” na ho to skip ho jata hai)
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # IndexNow key (optional override) â€” default code mein hai
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        # Optional: ImgBB free API key se banner instant CDN par host hoti hai (na ho to repo me save)
        IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        # Optional: Google Indexing API service-account JSON (poori JSON paste karein) â€” har post Google ko submit
        GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        # Optional: Multi-platform auto-share (jo set hoga sirf wahi share karega)
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        # Optional: Dev.to / Hashnode cross-post for backlinks
        DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
        HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
      run: |
        python auto_post_blogger.py

    - name: Commit and Push Queue Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A || true
        git commit -m "Update topic queue, posted history and banners [skip ci]" || echo "No changes to commit"
        git pull --rebase --autostash || true
        git push || echo "Push failed (maybe no changes)"
