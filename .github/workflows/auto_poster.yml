name: TechIT Auto Blog Poster

on:
  schedule:
    # Run everyday at 04:00 AM UTC (which is 9:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  auto_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to commit changes back to the repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Write Blogger Credentials File
      run: |
        echo '${{ secrets.BLOGGER_CREDENTIALS_JSON }}' > blogger_credentials.json

    - name: Run Auto-Poster Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PUBLISH_LIVE: 'false' # Set to 'true' in your GitHub Secrets/Variables if you want posts to go Live instantly (default is Draft)
      run: |
        python auto_post_blogger.py

    - name: Commit and Push Queue Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add topics_to_write.txt posted_topics.json || true
        git commit -m "Update topic queue and posted history [skip ci]" || echo "No changes to commit"
        git push || echo "Push failed (maybe no changes)"
